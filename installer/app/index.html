<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>安装探迹话术上传助手</title>
    <link rel="stylesheet" href="fonts/wght.css" />
    <link rel="stylesheet" href="installer.css" />
  </head>
  <body>
    <header class="titlebar">
      <button class="window-close" id="close" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.1" /></svg>
      </button>
    </header>
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.png" alt="" />
        <div>
          <div class="brand-name" id="brand-name">探迹话术上传助手</div>
          <div class="brand-version" id="version"></div>
        </div>
      </div>
      <ol class="steps" id="steps"></ol>
      <ul class="features" id="features">
        <li>
          <svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="1.5" width="12" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          <span>Excel 一键上传</span>
        </li>
        <li>
          <svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 6.5v3M5.7 4v8M8.4 2.5v11M11.1 5v6M13.8 7v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
          <span>录音自动配对</span>
        </li>
        <li id="feature-ai">
          <svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M5.3 7V5.2a2.7 2.7 0 0 1 5.4 0V7" fill="none" stroke="currentColor" stroke-width="1.3" /></svg>
          <span>本机 AI，资料不外传</span>
        </li>
      </ul>
    </aside>
    <div class="content">
      <div class="ambient" id="ambient" aria-hidden="true">
        <div class="ambient-sheet">
          <div class="ambient-glow"></div>
          <div class="ambient-glow"></div>
          <div class="ambient-glow"></div>
        </div>
      </div>
      <main id="root"></main>
    </div>
    <script src="installer.js"></script>
  </body>
</html>
